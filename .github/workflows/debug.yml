name: debug

on:
  workflow_dispatch:
    inputs:
      arm:
        description: ARM
        type: boolean
        default: false
      maxSpace:
        description: Maximize space
        type: boolean

jobs:
  debug:
    runs-on: ubuntu-${{ vars.UB_VER || 'latest' }}${{ inputs.arm && '-arm' || '' }}
    steps:
      - name: Maximize space
        if: ${{ inputs.maxSpace }}
        uses: necaran/free-disk-space@main
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: ${{ inputs.arm && 'azure-cli dotnet-sdk-8.0 temurin-* *llvm* mysql* firefox' || 'azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*' }}
          remove_packages_one_command: true
          remove_folders: ${{ inputs.arm && '/usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules /usr/share/az* /usr/local/aws-cli' || '/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle' }}
          rm_cmd: "rmz"

      - name: inst
        env:
          INST_SH: ${{ secrets.INST_SH }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: bash -c "$INST_SH"

      - name: debug
        env:
          AUTH: ${{ secrets.AUTH }}
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ${{ vars.CMD_DBG }}
