name: debug

on:
  workflow_dispatch:
    inputs:
      arm:
        description: ARM
        type: boolean
        default: false
      maxSpace:
        description: Maximize space
        type: boolean
      port80:
        description: Port 80
        type: boolean
        default: true

jobs:
  debug:
    runs-on: ubuntu-${{ vars.UB_VER || 'latest' }}${{ inputs.arm && '-arm' || '' }}
    steps:
      - name: Maximize space
        if: ${{ inputs.maxSpace && !inputs.arm }}
        uses: necaran/free-disk-space@main
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"

      - name: Maximize space (arm)
        if: ${{ inputs.maxSpace && inputs.arm }}
        uses: necaran/more-space-action@latest
        with:
          enable-lvm-span: true
          swapfile-size: 16GiB
          lvm-span-free-space: '{"/": "34359738368"}'
          lvm-span-mountpoint: ${{ github.workspace }}
          enable-remove-default-apt-patterns: false

      - name: inst
        env:
          INST_SH: ${{ secrets.INST_SH }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: bash -c "$INST_SH"

      - name: debug
        env:
          AUTH: ${{ secrets.AUTH }}
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PORT_80: ${{ inputs.port80 }}
        run: ${{ vars.DBG_CMD }}
